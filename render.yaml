services:
  - type: web
    name: bigbrother-public-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_API_MODE
        value: 'true'
      - key: ALLOWED_ORIGINS
        value: https://martin-lopez25.github.io
      - key: TRUST_PROXY_HEADERS
        value: 'true'